services:
  zerodrop:
    build:
      context: .
      dockerfile: Dockerfile
    image: zerodrop:latest
    container_name: zerodrop
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistance de la base de données SQLite en local
      - ./data:/data
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
