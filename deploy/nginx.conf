# ========================================================
# Configuration Nginx pour ZeroDrop (avec support WebSockets)
# ========================================================
server {
    listen 80;
    server_name webhooks.votre-domaine.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name webhooks.votre-domaine.com;

    # Certificats SSL (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/webhooks.votre-domaine.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/webhooks.votre-domaine.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # En-têtes obligatoires pour WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts pour connexions WebSockets persistantes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
